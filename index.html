<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Portal</title>
<style>
:root{--bg:#F1F5F6;--card:#fff;--ink:#12303A;--muted:#587079;--line:#D5E0E3;--side:#0E3B43;--side-ink:#CFE6E9;
--accent:#0B8A8F;--pop:#F2B134;--good:#1E8E5A;--warn:#C2410C;--r:14px;--f:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0C1A1E;--card:#14262B;--ink:#E4F1F3;--muted:#93AEB4;--line:#244047;--side:#08262B;--accent:#3FC1C6;--good:#4ADE9A;--warn:#FB923C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.app{display:grid;grid-template-columns:15rem 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:1.25rem 1rem;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.7rem;margin-bottom:2rem;color:#fff}
.logo{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:.6rem;background:var(--pop);color:#12303A;font-weight:800}
#nav{display:grid;gap:.25rem}
#nav a{display:flex;gap:.8rem;align-items:center;padding:.7rem .9rem;border-radius:.7rem;color:inherit;text-decoration:none;font-weight:600}
#nav a i{font-style:normal;width:1.2rem;text-align:center}
#nav a:hover{background:rgba(255,255,255,.08)}
#nav a.on{background:var(--pop);color:#12303A}
main{padding:2rem clamp(1rem,4vw,3rem);max-width:70rem;width:100%}
h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 .25rem;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0 0 .9rem}
.sub{color:var(--muted);margin:0 0 1.5rem}
.grid{display:grid;gap:1rem}
.stats{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));margin-bottom:1rem}
.two{grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.25rem}
.stat b{display:block;font-size:1.8rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.stat.hl{border-left:6px solid var(--pop)}
.row{display:flex;gap:1rem;padding:.75rem 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-of-type{border-top:0}
.time{min-width:7.5rem;font-weight:600;color:var(--accent);font-size:.92rem}
.row p{margin:0;color:var(--muted);font-size:.9rem}
.row.now{background:color-mix(in srgb,var(--pop) 22%,transparent);border-radius:.6rem;padding-inline:.6rem;margin-inline:-.6rem}
.tabs,.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.tabs button,.chips button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.5rem 1rem;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--muted);padding:1rem 0}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:.7rem .5rem;border-bottom:1px solid var(--line)}
.tbl th{font-size:.85rem;color:var(--muted)}
.wrapx{overflow-x:auto}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line)}
.tag.good{color:var(--good)}.tag.warn{color:var(--warn)}
.news h3{margin:.2rem 0;font-size:1.05rem}
.news small{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin-top:1rem}
form{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
label{display:grid;gap:.3rem;font-weight:600;font-size:.9rem}
input{font:inherit;padding:.65rem .8rem;border-radius:.6rem;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;background:var(--accent);color:#fff;padding:.7rem 1.4rem;border-radius:999px;cursor:pointer;justify-self:start}
.avatar{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--pop);color:#12303A;display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.who{display:flex;gap:1rem;align-items:center;margin-bottom:1.25rem}
@media(max-width:48rem){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:auto 0 0 0;height:auto;z-index:5;padding:.4rem;padding-bottom:max(.4rem,env(safe-area-inset-bottom))}
 .brand{display:none}
 #nav{grid-auto-flow:column;grid-auto-columns:1fr}
 #nav a{flex-direction:column;gap:.1rem;padding:.4rem;font-size:.72rem;text-align:center}
 main{padding-bottom:6rem}
}
@media(prefers-reduced-motion:no-preference){main>*{animation:in .25s ease-out}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true">S</span><b>Student Portal</b></div>
    <nav id="nav" aria-label="Main">
      <a href="#dashboard" data-v="dashboard"><i>▦</i><span>Dashboard</span></a>
      <a href="#schedule" data-v="schedule"><i>◷</i><span>Schedule</span></a>
      <a href="#grades" data-v="grades"><i>✓</i><span>Grades</span></a>
      <a href="#announcements" data-v="announcements"><i>✉</i><span>News</span></a>
      <a href="#profile" data-v="profile"><i>☺</i><span>Profile</span></a>
    </nav>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script>
/* ===== EDIT YOUR DATA HERE ===== */
const DATA = {
  student: { name: "Your Name", id: "2026-00000", program: "BS Information Technology", year: "1st Year", email: "you@example.com" },
  // days: 1=Mon ... 6=Sat. Times are 24-hour.
  classes: [
    { name: "PT 101", days: [2,4], s: "07:30", e: "09:00", loc: "D" },
    { name: "PT 101", days: [2,4], s: "09:00", e: "10:00", loc: "D" },
    { name: "Pathfit 2", days: [1,3], s: "10:30", e: "11:30", loc: "AL" },
    { name: "HCI", days: [1,3], s: "12:30", e: "14:00", loc: "B", mode: "Face-to-face" },
    { name: "CWTS NSTP", days: [6], s: "12:00", e: "15:00", loc: "J" },
    { name: "CCS103", days: [2,4], s: "14:00", e: "15:00", loc: "IT", mode: "Virtual" },
    { name: "Witness Soc", days: [1,3,5], s: "14:30", e: "15:30", loc: "L" },
    { name: "CCS103", days: [2,4], s: "15:00", e: "16:30", loc: "B" },
    { name: "HCI", days: [1,3], s: "16:30", e: "17:30", loc: "Online", mode: "Virtual" },
    { name: "GEC Ethics", days: [1,3,5], s: "17:30", e: "18:30", loc: "L" }
  ],
  // Sample grades: replace with your real ones. Use null if not released yet. Scale: 1.0 (best) to 5.0.
  grades: [
    { course: "PT 101", units: 3, mid: 1.5, fin: null },
    { course: "Pathfit 2", units: 2, mid: 1.25, fin: null },
    { course: "HCI", units: 3, mid: 1.75, fin: null },
    { course: "CCS103", units: 3, mid: 2.0, fin: null },
    { course: "Witness Soc", units: 3, mid: 1.5, fin: null },
    { course: "GEC Ethics", units: 3, mid: null, fin: null },
    { course: "CWTS NSTP", units: 3, mid: 1.25, fin: null }
  ],
  news: [
    { cat: "Academic", date: "2026-11-24", title: "Finals schedule posted", body: "Check your course pages for exam dates and rooms. Bring a valid school ID." },
    { cat: "Events", date: "2026-11-20", title: "Intramurals week", body: "Classes end at 3:00 PM on Friday to give everyone time to join the opening program." },
    { cat: "Admin", date: "2026-11-18", title: "Update your enlistment details", body: "Report any schedule conflicts to the registrar before the end of the month." },
    { cat: "Academic", date: "2026-11-12", title: "Library extended hours", body: "The library stays open until 9:00 PM during the exam period." }
  ]
};
/* ===== END OF EDITABLE DATA ===== */

const $ = s => document.querySelector(s);
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = t => { let [h, m] = t.split(":").map(Number); const p = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${p}`; };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const profile = () => ({ ...DATA.student, ...store.get("portal.profile", {}) });
const onDay = d => DATA.classes.filter(c => c.days.includes(d)).sort((a, b) => mins(a.s) - mins(b.s));
const gwa = () => {
  const g = DATA.grades.map(r => ({ u: r.units, v: r.fin ?? r.mid })).filter(r => r.v != null);
  const u = g.reduce((a, r) => a + r.u, 0);
  return u ? (g.reduce((a, r) => a + r.u * r.v, 0) / u).toFixed(2) : "–";
};
const classRow = (c, now) => {
  const live = now != null && mins(c.s) <= now && now < mins(c.e);
  return `<div class="row${live ? " now" : ""}"><div class="time">${fmt(c.s)} – ${fmt(c.e)}</div><div><b>${esc(c.name)}</b>${live ? ' <span class="tag good">Now</span>' : ""}<p>Room ${esc(c.loc)}${c.mode ? " · " + esc(c.mode) : ""}</p></div></div>`;
};
const newsCard = n => `<article class="card news"><span class="tag">${esc(n.cat)}</span><h3>${esc(n.title)}</h3><small>${new Date(n.date + "T00:00").toLocaleDateString("en-PH", { month: "long", day: "numeric", year: "numeric" })}</small><p>${esc(n.body)}</p></article>`;

const views = {
  dashboard() {
    const p = profile(), d = new Date(), now = d.getHours() * 60 + d.getMinutes(), today = onDay(d.getDay());
    const next = today.find(c => mins(c.s) > now) || today.find(c => mins(c.s) <= now && now < mins(c.e));
    const hr = d.getHours(), hi = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
    return `<h1>${hi}, ${esc(p.name.split(" ")[0])}</h1><p class="sub">${d.toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric" })}</p>
    <div class="grid stats">
      <div class="card stat hl"><b>${today.length}</b><span>Classes today</span></div>
      <div class="card stat"><b>${next ? fmt(next.s) : "Done"}</b><span>${next ? "Next: " + esc(next.name) : "No more classes today"}</span></div>
      <div class="card stat"><b>${gwa()}</b><span>Current GWA</span></div>
      <div class="card stat"><b>${DATA.news.length}</b><span>Announcements</span></div>
    </div>
    <div class="grid two">
      <section class="card"><h2>Today’s classes</h2>${today.length ? today.map(c => classRow(c, now)).join("") : '<p class="empty">No classes today. Enjoy the free time.</p>'}</section>
      <section class="grid">${DATA.news.slice(0, 2).map(newsCard).join("")}</section>
    </div>`;
  },
  schedule() {
    const d = new Date().getDay(), sel = Number(store.get("portal.day", d === 0 ? 1 : d));
    const list = onDay(sel), now = sel === d ? d && new Date().getHours() * 60 + new Date().getMinutes() : null;
    return `<h1>Class schedule</h1><p class="sub">Pick a day to see your classes.</p>
    <div class="tabs" role="group" aria-label="Day">${[1,2,3,4,5,6].map(i => `<button data-day="${i}" aria-pressed="${i === sel}">${DAYS[i].slice(0, 3)}</button>`).join("")}</div>
    <section class="card"><h2>${DAYS[sel]}</h2>${list.length ? list.map(c => classRow(c, now)).join("") : '<p class="empty">No classes on this day.</p>'}</section>`;
  },
  grades() {
    const rows = DATA.grades.map(r => {
      const v = r.fin ?? r.mid, st = v == null ? ["Pending", ""] : v <= 3 ? ["Passing", "good"] : ["At risk", "warn"];
      return `<tr><td>${esc(r.course)}</td><td>${r.units}</td><td>${r.mid ?? "–"}</td><td>${r.fin ?? "–"}</td><td><span class="tag ${st[1]}">${st[0]}</span></td></tr>`;
    }).join("");
    return `<h1>Grades</h1><p class="sub">Current GWA: <b>${gwa()}</b> (1.0 is the highest)</p>
    <section class="card wrapx"><table class="tbl"><thead><tr><th>Course</th><th>Units</th><th>Midterm</th><th>Final</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></section>
    <p class="note">These are sample grades. Edit them in the DATA section of this file.</p>`;
  },
  announcements() {
    const cats = ["All", ...new Set(DATA.news.map(n => n.cat))], sel = store.get("portal.cat", "All");
    return `<h1>Announcements</h1><p class="sub">News from your school.</p>
    <div class="chips" role="group" aria-label="Category">${cats.map(c => `<button data-cat="${c}" aria-pressed="${c === sel}">${c}</button>`).join("")}</div>
    <div class="grid two">${DATA.news.filter(n => sel === "All" || n.cat === sel).map(newsCard).join("")}</div>`;
  },
  profile() {
    const p = profile(), ini = p.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const f = (k, l, t = "text") => `<label>${l}<input name="${k}" type="${t}" value="${esc(p[k])}" required></label>`;
    return `<h1>Student profile</h1><p class="sub">Your details are saved in this browser only.</p>
    <section class="card"><div class="who"><div class="avatar" aria-hidden="true">${esc(ini)}</div><div><b>${esc(p.name)}</b><p class="sub" style="margin:0">${esc(p.program)} · ${esc(p.year)}</p></div></div>
    <form id="pf">${f("name", "Full name")}${f("id", "Student ID")}${f("program", "Program")}${f("year", "Year level")}${f("email", "Email", "email")}<button class="btn" type="submit">Save profile</button></form><p class="note" id="saved" role="status"></p></section>`;
  }
};

function route() {
  const v = views[location.hash.slice(1)] ? location.hash.slice(1) : "dashboard";
  $("#view").innerHTML = views[v]();
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  document.title = v[0].toUpperCase() + v.slice(1) + " · Student Portal";
  const pf = $("#pf");
  if (pf) pf.onsubmit = e => {
    e.preventDefault();
    store.set("portal.profile", Object.fromEntries(new FormData(pf)));
    route();
    $("#saved").textContent = "Profile saved.";
  };
}
$("#view").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.day) { store.set("portal.day", b.dataset.day); route(); }
  if (b.dataset.cat) { store.set("portal.cat", b.dataset.cat); route(); }
});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
